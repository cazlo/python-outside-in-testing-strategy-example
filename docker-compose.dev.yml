# docker-compose.dev.yml
# For local development and unit testing with coverage
# Run with: docker compose -f docker-compose.dev.yml up --build

services:
  database:
    image: docker.io/postgres:17
    restart: always
    container_name: database_dev
    env_file: ".env"
    user: root
    volumes:
      - db_dev_data:/var/lib/postgresql/data
      - ./create-dbs.sql:/docker-entrypoint-initdb.d/create-dbs.sql
    ports:
      - 5454:5432
    expose:
      - 5432
    environment:
      - POSTGRES_USERNAME=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DATABASE=${DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  redis_server:
    image: docker.io/valkey/valkey:8.1-alpine3.21
    container_name: redis_server_dev
    restart: always
    expose:
      - 6379
    env_file: .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app
  
  rabbitmq:
    image: docker.io/rabbitmq:3.13-management
    container_name: rabbitmq_dev
    restart: always
    expose:
      - 5672
      - 15672
    ports:
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - app

  # Test container that runs pytest with coverage
  # This is used for gathering coverage data during development
  test_runner:
    container_name: test_runner_dev
    image: python-outside-in-test:latest
    build:
      context: .
      target: test
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./src:/opt/app/src:rw
      - ./htmlcov:/opt/app/htmlcov:rw
    environment:
      DATABASE_HOST: database
      REDIS_HOST: redis_server
      RABBITMQ_HOST: rabbitmq
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis_server:6379/0
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
      redis_server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "cd src && 
             pytest -v --cov=app --cov-report=html --cov-report=term &&
             echo 'Tests completed. Coverage report in htmlcov/index.html'"
    networks:
      - app

volumes:
  db_dev_data:
  rabbitmq_dev_data:

networks:
  app:
